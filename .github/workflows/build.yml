name: Build Phoenicx TV

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.11.1

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "note=Signed with the release key." >> "$GITHUB_OUTPUT"
          else
            # No secrets: sign with a temporary key so the APK still installs.
            KEYSTORE_PASSWORD="phoenicxtv"
            keytool -genkeypair -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -alias phoenicxtv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Phoenicx TV" >/dev/null 2>&1
            echo "note=Signed with a temporary key (add KEYSTORE_BASE64 and KEYSTORE_PASSWORD secrets to use your own)." >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 / KEYSTORE_PASSWORD secrets: the APK is signed with a temporary key."
          fi
          ALIAS=$(keytool -list -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep -i 'PrivateKeyEntry' | head -n 1 | cut -d, -f1)
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
          echo "Using key alias: $ALIAS"

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PhoenicxTV.apk
          rm -f "$KEYSTORE_FILE"
          ls -la out

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: PhoenicxTV-${{ steps.version.outputs.value }}
          path: out/PhoenicxTV.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Phoenicx TV ${{ steps.version.outputs.value }}
          overwrite_files: true
          make_latest: true
          body: |
            **Phoenicx TV ${{ steps.version.outputs.value }}** — a tiny IPTV player for Fire TV, Android TV and phones.

            **Install on Fire TV:** open the *Downloader* app and enter
            `https://github.com/${{ github.repository }}/releases/latest/download/PhoenicxTV.apk`

            ${{ steps.signing.outputs.note }}
          files: out/PhoenicxTV.apk
