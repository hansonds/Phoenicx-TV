name: Build Phoenicx TV

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.8.2

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/PhoenicxTV.apk
          ls -la out

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v7
        with:
          name: PhoenicxTV-${{ steps.version.outputs.value }}
          path: out/PhoenicxTV.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Phoenicx TV ${{ steps.version.outputs.value }}
          overwrite_files: true
          make_latest: true
          body: |
            **Phoenicx TV ${{ steps.version.outputs.value }}** — a tiny IPTV player for Fire TV, Android TV and phones.

            **Install on Fire TV:** open the *Downloader* app and enter
            `https://github.com/${{ github.repository }}/releases/latest/download/PhoenicxTV.apk`

          files: out/PhoenicxTV.apk
